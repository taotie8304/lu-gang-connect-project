version: '3.8'

# ===== 鲁港通跨境AI智能平台 - 生产环境部署配置 =====
# 
# 包含两个核心服务：
# - 鲁港通前端（鲁港通跨境AI智能服务助手）- 基于 FastGPT 4.14.4 定制
# - 鲁港通后端（鲁港通跨境AI智能服务后端）- 基于 One API 定制
#
# 使用 GitHub Container Registry 镜像

services:
  # ===== MongoDB 数据库 =====
  mongo:
    image: mongo:5.0.18
    container_name: lugang-ai-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-password}
    volumes:
      - ./data/mongo:/data/db
    networks:
      - lugang-ai-network

  # ===== PostgreSQL 向量数据库 =====
  pg:
    image: pgvector/pgvector:pg15
    container_name: lugang-ai-pg
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-password}
      POSTGRES_DB: postgres
    volumes:
      - ./data/pg:/var/lib/postgresql/data
    networks:
      - lugang-ai-network

  # ===== Redis 缓存 =====
  redis:
    image: redis:7.2-alpine
    container_name: lugang-ai-redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - ./data/redis:/data
    networks:
      - lugang-ai-network

  # ===== MinIO（fastgpt-plugin 依赖；与 deploy 规范中的 Minio 一致）=====
  minio:
    image: minio/minio:RELEASE.2024-09-07T16-13-09Z
    container_name: lugang-ai-minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - ./data/minio:/data
    networks:
      - lugang-ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ===== 鲁港通前端（鲁港通跨境AI智能服务助手）=====
  # 域名: www.airscend.com
  # 端口: 3210
  lugang-ai:
    image: ${LUGANG_AI_IMAGE:-ghcr.io/your-username/lugang-ai:latest}
    container_name: lugang-ai-app
    restart: always
    ports:
      - "3210:3000"
    depends_on:
      - mongo
      - pg
      - redis
      - plugin
    env_file:
      - ./projects/app/.env.local
    environment:
      PLUGIN_BASE_URL: http://plugin:8080
      PLUGIN_TOKEN: ${PLUGIN_AUTH_TOKEN:-lugangplugin2025}
    networks:
      - lugang-ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===== 插件服务（系统插件上传/执行）=====
  plugin:
    image: registry.cn-hangzhou.aliyuncs.com/fastgpt/fastgpt-plugin:v0.3.4
    container_name: lugang-ai-plugin
    restart: always
    ports:
      - "8088:8080"
    env_file:
      - ./projects/app/.env.local
    depends_on:
      mongo:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    environment:
      AUTH_TOKEN: ${PLUGIN_AUTH_TOKEN:-lugangplugin2025}
      DB_MAX_LINK: 10
      SERVICE_REQUEST_MAX_CONTENT_LENGTH: 10
      MAX_API_SIZE: 10
      # MONGODB_URI / REDIS_URL 与 lugang-ai 共用 .env.local，避免 compose 默认值与库密码不一致
      S3_EXTERNAL_BASE_URL: ${S3_EXTERNAL_BASE_URL:-http://127.0.0.1:9000}
      S3_ENDPOINT: minio
      S3_PORT: 9000
      S3_USE_SSL: "false"
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET:-lugang-public}
      S3_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET:-lugang-private}
      S3_PATH_STYLE: "true"
    volumes:
      # 持久化 pkgs 目录并保留 package.json（{"type":"module"}），
      # 确保 Node.js 能以 ESM 方式 import 无扩展名的 .pkg 文件
      - ./data/plugin-pkgs:/tmp/fastgpt-plugin/pkgs
    networks:
      - lugang-ai-network

  # ===== 鲁港通后端（鲁港通跨境AI智能服务后端）=====
  # 域名: api.airscend.com
  # 端口: 8080
  lugang-enterprise:
    image: ${LUGANG_ENTERPRISE_IMAGE:-ghcr.io/your-username/lugang-enterprise:latest}
    container_name: lugang-enterprise
    restart: always
    ports:
      - "8080:3000"
    depends_on:
      - pg
      - redis
    environment:
      - SQL_DSN=postgres://${PG_USER:-postgres}:${PG_PASSWORD:-password}@pg:5432/oneapi?sslmode=disable
      - REDIS_CONN_STRING=redis://redis:6379
      - SESSION_SECRET=${SESSION_SECRET:-lugang-session-secret-2025}
      - TZ=Asia/Shanghai
    volumes:
      - ./data/oneapi:/data
    networks:
      - lugang-ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  lugang-ai-network:
    driver: bridge

volumes:
  mongo-data:
  pg-data:
  redis-data:
  oneapi-data:
