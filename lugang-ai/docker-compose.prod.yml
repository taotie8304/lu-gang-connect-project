version: '3.8'

# ===== 鲁港通跨境AI智能平台 - 生产环境部署配置（FastGPT 4.16.2）=====
#
# 阶段 4 重写：对齐官方 4.16.2 部署规范 + 保留鲁港通定制决策
#
# 服务拓扑：
#   - lugang-ai      前端（自建镜像 ${LUGANG_AI_IMAGE}），www.airscend.com:3210
#   - plugin         fastgpt-plugin v1.1.1（独立数据库 fastgpt-plugin + FASTGPT_BASE_URL + AUTH_TOKEN≥32）
#   - sandbox        fastgpt-code-sandbox v4.16.0（工作流「代码运行」节点依赖）
#   - mcp-server     fastgpt-mcp_server v4.14.23（MCP 对外服务，用户选择启用）
#   - mongo/pg/redis/minio  基础存储
#
# 鲁港通定制决策（勿改）：
#   - 前端端口 3210，数据库名 lugang_ai，容器名前缀 lugang-ai-*，数据用 ./data/* bind mount（宝塔备份友好）
#   - N3：大模型在 FastGPT 内直连阿里百炼，不部署 AI Proxy 容器
#   - 用户决策：不启用 agent-sandbox 全套（opensandbox-server / volume-manager / agent-sandbox-proxy 均不部署）
#
# 4.16.2 关键升级：
#   - MongoDB 改为单节点副本集（4.16.2 起知识库数据写入强制事务，standalone 会启动失败）
#   - plugin v0.3.4 → v1.1.1：容器内端口 3000（非 8080），使用独立库、STORAGE_* 新对象存储规范
#   - 移除已废弃的 PARSE_FILE_WORKERS 等 4 个 Worker 并发变量
#
# 凭证来源：
#   - 数据库/存储密码：由 .env.deploy 提供，沿用生产现值（分层密钥策略：DB 类保持不变以平滑沿用数据）
#   - 应用通信令牌 PLUGIN_AUTH_TOKEN / CODE_SANDBOX_TOKEN：由 deploy-prod.sh 自动生成强随机值写入 .env.deploy（≥32 位）
#
# ⚠️ 正式部署前必须先备份 ./data/mongo（副本集原地升级）与 ./data/minio；AES256_SECRET_KEY 不可更换（否则已加密的模型密钥无法解密）

services:
  # ===== MongoDB（单节点副本集，4.16.2 事务依赖）=====
  mongo:
    image: registry.cn-hangzhou.aliyuncs.com/fastgpt/mongo:5.0.32 # CPU 不支持 AVX 时改用 4.4.29
    container_name: lugang-ai-mongo
    restart: always
    ports:
      # 鲁港通 - 保留现有对外映射便于宝塔运维；生产建议在安全组/防火墙限制来源 IP，勿裸露公网
      - "27017:27017"
    networks:
      - lugang-ai-network
    command: mongod --keyFile /data/mongodb.key --replSet rs0 --bind_ip_all
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-password}
    volumes:
      - ./data/mongo:/data/db
    healthcheck:
      test:
        [
          'CMD',
          'mongo',
          '-u',
          '${MONGO_USER:-root}',
          '-p',
          '${MONGO_PASSWORD:-password}',
          '--authenticationDatabase',
          'admin',
          '--eval',
          "db.adminCommand('ping')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    entrypoint:
      - bash
      - -c
      - |
        # 鲁港通 - 单节点副本集初始化：生成 keyFile 并在首次启动时 rs.initiate（数据保留，不丢库）
        openssl rand -base64 128 > /data/mongodb.key
        chmod 400 /data/mongodb.key
        chown 999:999 /data/mongodb.key
        echo 'const isInited = rs.status().ok === 1
        if(!isInited){
          rs.initiate({
              _id: "rs0",
              members: [
                  { _id: 0, host: "mongo:27017" }
              ]
          })
        }' > /data/initReplicaSet.js
        # 启动 MongoDB 服务
        exec docker-entrypoint.sh "$$@" &
        # 等待 MongoDB 服务启动
        until mongo -u ${MONGO_USER:-root} -p ${MONGO_PASSWORD:-password} --authenticationDatabase admin --eval "print('waited for connection')"; do
          echo "Waiting for MongoDB to start..."
          sleep 2
        done
        # 执行初始化副本集脚本
        mongo -u ${MONGO_USER:-root} -p ${MONGO_PASSWORD:-password} --authenticationDatabase admin /data/initReplicaSet.js
        # 等待 docker-entrypoint.sh 启动的 MongoDB 主进程
        wait $$!

  # ===== PostgreSQL 向量数据库 =====
  pg:
    image: registry.cn-hangzhou.aliyuncs.com/fastgpt/pgvector:0.8.0-pg15
    container_name: lugang-ai-pg
    restart: always
    ports:
      # 鲁港通 - 同 mongo，生产建议限制来源 IP
      - "5432:5432"
    networks:
      - lugang-ai-network
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-password}
      POSTGRES_DB: postgres
    volumes:
      - ./data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', '${PG_USER:-postgres}', '-d', 'postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  # ===== Redis 缓存 =====
  redis:
    image: registry.cn-hangzhou.aliyuncs.com/fastgpt/redis:7.2-alpine
    container_name: lugang-ai-redis
    restart: always
    # 鲁港通 - Redis 仅作内部缓存/会话，不发布宿主端口（避免重蹈宝塔 Redis 无密码裸奔 *:6379 的覆辙）；如需宿主机调试可临时加 ports
    networks:
      - lugang-ai-network
    command: |
      redis-server --loglevel warning --maxclients 10000 --appendonly yes --save 60 10 --maxmemory 4gb --maxmemory-policy noeviction
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s

  # ===== MinIO 对象存储（fastgpt-plugin / 前端文件依赖）=====
  minio:
    image: registry.cn-hangzhou.aliyuncs.com/fastgpt/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: lugang-ai-minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - lugang-ai-network
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ===== 插件服务 fastgpt-plugin v1.1.1（系统插件上传/执行，.pkg 上传依赖）=====
  plugin:
    image: registry.cn-hangzhou.aliyuncs.com/fastgpt/fastgpt-plugin:v1.1.1
    container_name: lugang-ai-plugin
    restart: always
    networks:
      - lugang-ai-network
    depends_on:
      mongo:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      # 鲁港通 - v4.15+ plugin 使用独立数据库，避免与主库 lugang_ai 集合冲突
      MONGODB_URI: mongodb://${MONGO_USER:-root}:${MONGO_PASSWORD:-password}@mongo:27017/fastgpt-plugin?authSource=admin
      DB_MAX_LINK: 100
      REDIS_URL: redis://redis:6379
      # plugin 回调主应用地址（容器内网，前端容器内端口 3000）
      FASTGPT_BASE_URL: http://lugang-ai:3000
      # 服务间通信令牌，必须与前端 PLUGIN_TOKEN 一致，且 ≥32 位（由 deploy-prod.sh 生成写入 .env.deploy）
      AUTH_TOKEN: ${PLUGIN_AUTH_TOKEN}
      # 对象存储（4.15+ STORAGE_* 新规范，用于存放插件包）
      STORAGE_VENDOR: minio
      STORAGE_REGION: us-east-1
      STORAGE_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      STORAGE_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      STORAGE_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET:-lugang-public}
      STORAGE_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET:-lugang-private}
      STORAGE_S3_ENDPOINT: http://minio:9000
      STORAGE_S3_FORCE_PATH_STYLE: "true"
      STORAGE_S3_MAX_RETRIES: 3
      STORAGE_DOWNLOAD_URL_MODE: short-proxy
      # 工具网络请求，最大请求和响应体（MB）
      SERVICE_REQUEST_MAX_CONTENT_LENGTH: 10
      # 最大 API 请求体大小（MB）
      MAX_API_SIZE: 10
      LOG_OTEL_SERVICE_NAME: fastgpt-plugin
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 30s
      timeout: 20s
      retries: 3

  # ===== 代码沙箱 fastgpt-code-sandbox v4.16.0（工作流「代码运行」节点）=====
  sandbox:
    image: registry.cn-hangzhou.aliyuncs.com/fastgpt/fastgpt-code-sandbox:v4.16.0
    container_name: lugang-ai-sandbox
    restart: always
    security_opt:
      - no-new-privileges:true
    networks:
      - lugang-ai-network
    environment:
      # 必须与前端 CODE_SANDBOX_TOKEN 一致（由 deploy-prod.sh 生成写入 .env.deploy）
      SANDBOX_TOKEN: ${CODE_SANDBOX_TOKEN}
      # ===== 资源限制 =====
      SANDBOX_API_MAX_BODY_MB: 8
      SANDBOX_MAX_TIMEOUT: 60000
      SANDBOX_MAX_MEMORY_MB: 256
      SANDBOX_MAX_OUTPUT_MB: 10
      # ===== 进程池 =====
      SANDBOX_POOL_SIZE: 20
      # ===== 网络请求限制 =====
      CHECK_INTERNAL_IP: true
      SANDBOX_REQUEST_MAX_COUNT: 30
      SANDBOX_REQUEST_TIMEOUT: 60000
      SANDBOX_REQUEST_MAX_RESPONSE_MB: 10
      SANDBOX_REQUEST_MAX_BODY_MB: 5
      # ===== 模块白名单 =====
      SANDBOX_JS_ALLOWED_MODULES: lodash,dayjs,moment,uuid,crypto-js,qs,url,querystring
      SANDBOX_PYTHON_ALLOWED_MODULES: math,cmath,decimal,fractions,random,statistics,collections,array,heapq,bisect,queue,copy,itertools,functools,operator,string,re,difflib,textwrap,unicodedata,codecs,datetime,time,calendar,_strptime,json,csv,base64,binascii,struct,hashlib,hmac,secrets,uuid,typing,abc,enum,dataclasses,contextlib,pprint,weakref,numpy,pandas,matplotlib
      LOG_OTEL_SERVICE_NAME: fastgpt-code-sandbox
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/health').then((res) => { if (!res.ok) throw new Error(String(res.status)); })"
        ]
      interval: 30s
      timeout: 20s
      retries: 3

  # ===== 鲁港通前端（自建镜像）www.airscend.com:3210 =====
  lugang-ai:
    image: ${LUGANG_AI_IMAGE:-ghcr.io/your-username/lugang-ai:latest}
    container_name: lugang-ai-app
    restart: always
    ports:
      - "3210:3000"
    networks:
      - lugang-ai-network
    depends_on:
      mongo:
        condition: service_healthy
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      plugin:
        condition: service_healthy
      sandbox:
        condition: service_healthy
    env_file:
      - ./projects/app/.env.local
    environment:
      # 鲁港通 - 覆盖 .env.local 中的服务地址/令牌，确保与 compose 内网一致（environment 优先级高于 env_file）
      # 插件服务地址：v1.1.2 容器内端口为 3000（旧 v0.3.4 为 8080）
      PLUGIN_BASE_URL: http://plugin:3000
      PLUGIN_TOKEN: ${PLUGIN_AUTH_TOKEN}
      # 代码沙箱服务地址
      CODE_SANDBOX_URL: http://sandbox:3000
      CODE_SANDBOX_TOKEN: ${CODE_SANDBOX_TOKEN}
    volumes:
      # 鲁港通 - 沿用生产系统配置（品牌 feConfigs / systemEnv / 旧模型表），缺失会丢失「鲁港通AI助手」标题等定制
      - ./config/config.json:/app/data/config.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===== MCP Server fastgpt-mcp_server v4.14.23（对外 MCP 服务，用户选择启用）=====
  mcp-server:
    image: registry.cn-hangzhou.aliyuncs.com/fastgpt/fastgpt-mcp_server:v4.14.23
    container_name: lugang-ai-mcp-server
    restart: always
    ports:
      - "3003:3000"
    networks:
      - lugang-ai-network
    depends_on:
      lugang-ai:
        condition: service_healthy
    environment:
      FASTGPT_ENDPOINT: http://lugang-ai:3000
      LOG_OTEL_SERVICE_NAME: fastgpt-mcp-server

networks:
  lugang-ai-network:
    driver: bridge
