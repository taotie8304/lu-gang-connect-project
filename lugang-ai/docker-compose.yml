version: '3.8'

# 鲁港通AI - FastGPT定制版部署配置
# 基于FastGPT 4.14.4

services:
  # ===== MongoDB数据库 =====
  mongo:
    image: mongo:5.0.18
    container_name: lugang-ai-mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - ./data/mongo:/data/db
    networks:
      - lugang-ai-network

  # ===== PostgreSQL向量数据库 =====
  pg:
    image: pgvector/pgvector:pg15
    container_name: lugang-ai-pg
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    volumes:
      - ./data/pg:/var/lib/postgresql/data
    networks:
      - lugang-ai-network

  # ===== Redis缓存 =====
  redis:
    image: redis:7.2-alpine
    container_name: lugang-ai-redis
    restart: always
    ports:
      - "6380:6379"  # 改为6380避免与宝塔Redis冲突
    volumes:
      - ./data/redis:/data
    networks:
      - lugang-ai-network

  # ===== MinIO 对象存储（系统插件 fastgpt-plugin 依赖 S3，请勿禁用）=====
  minio:
    image: minio/minio:RELEASE.2024-09-07T16-13-09Z
    container_name: lugang-ai-minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - ./data/minio:/data
    networks:
      - lugang-ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ===== 鲁港通AI主应用 =====
  lugang-ai:
    image: lugang-ai:v1
    container_name: lugang-ai-app
    restart: always
    ports:
      - "3210:3000"
    depends_on:
      - mongo
      - pg
      - redis
      - plugin
    env_file:
      - ./projects/app/.env.local
    environment:
      # 与 plugin 服务 AUTH_TOKEN 保持一致；避免仅依赖 .env.local 漏配导致上传 .pkg 失败
      PLUGIN_BASE_URL: http://plugin:8080
      PLUGIN_TOKEN: lugangplugin2025
    networks:
      - lugang-ai-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===== 代码沙箱（可选，已禁用） =====
  # sandbox:
  #   image: registry.cn-hangzhou.aliyuncs.com/fastgpt/fastgpt-sandbox:v4.14.4
  #   container_name: lugang-ai-sandbox
  #   restart: always
  #   networks:
  #     - lugang-ai-network

  # ===== 插件服务 =====
  plugin:
    image: registry.cn-hangzhou.aliyuncs.com/fastgpt/fastgpt-plugin:v0.3.4
    container_name: lugang-ai-plugin
    restart: always
    ports:
      - "8088:8080"
    env_file:
      - ./projects/app/.env.local
    depends_on:
      mongo:
        condition: service_started
      redis:
        condition: service_started
      minio:
        condition: service_healthy
    environment:
      AUTH_TOKEN: lugangplugin2025
      DB_MAX_LINK: 10
      SERVICE_REQUEST_MAX_CONTENT_LENGTH: 10
      MAX_API_SIZE: 10
      # MONGODB_URI / REDIS_URL 与主应用一致，从 .env.local 继承，避免与 mongo 实际密码不一致
      # 公网访问 MinIO 的地址（浏览器/外链场景）；容器互通关键为 S3_ENDPOINT=minio
      S3_EXTERNAL_BASE_URL: ${S3_EXTERNAL_BASE_URL:-http://127.0.0.1:9000}
      S3_ENDPOINT: minio
      S3_PORT: 9000
      S3_USE_SSL: "false"
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_PUBLIC_BUCKET: lugang-public
      S3_PRIVATE_BUCKET: lugang-private
      S3_PATH_STYLE: "true"
    volumes:
      # 持久化 pkgs 目录并保留 package.json（{"type":"module"}），
      # 确保 Node.js 能以 ESM 方式 import 无扩展名的 .pkg 文件
      - ./data/plugin-pkgs:/tmp/fastgpt-plugin/pkgs
    networks:
      - lugang-ai-network

networks:
  lugang-ai-network:
    driver: bridge

volumes:
  mongo-data:
  pg-data:
  redis-data:
  minio-data:
