  - id: hk_data_gov
    name: 香港开放数据平台 DATA.GOV.HK
    group: hk_core_gov
    organization: 香港特别行政区政府数字政策办公室
    base_domains: [api.data.gov.hk, app.data.gov.hk, data.gov.hk]
    allowed_path_prefixes: [/en-data/, /en/, /filestore/, /sc-data/, /sc/, /tc-data/, /tc/, /v1/, /v2/]
    discovery_method: api
    api_config:
      filter_api:
        url: https://api.data.gov.hk/v2/filter
      update_rss:
      - https://data.gov.hk/filestore/feeds/data_rss_en.xml
      - https://data.gov.hk/filestore/feeds/data_rss_sc.xml
      - https://data.gov.hk/filestore/feeds/data_rss_tc.xml
      archive_list_api:
        url: https://app.data.gov.hk/v1/historical-archive/list-files
        params:
          end: YYYYMMDD
          start: YYYYMMDD
    schedule: "0 */12 * * *"
    rate_limit_per_minute: 10
    enabled: false

  - id: hk_gia_press
    name: 政府新闻处新闻公报
    group: hk_core_gov
    organization: 香港特别行政区政府新闻处
    base_domains: [www.info.gov.hk]
    allowed_path_prefixes: [/gia/general/, /gia/rss/]
    # 鲁港通 - P1-A：改用 RSS（100 条/次，含完整列表标题）；原 ctoday.htm 列表页
    # 只有当日公报且需逐页抓取，覆盖不足。标题白名单只收政策/资助/立法类公报，
    # 泳滩红旗、火警、卖旗日、判囚、任命、体育活动等一律不入库。
    discovery_method: rss
    feed_urls:
      - "https://www.info.gov.hk/gia/rss/general_zh.xml"
    content_selector: "#contentbody"
    title_include_patterns:
      - '政策|措施|計劃|資助|基金|津貼|補貼|援助|貸款|擔保|申請|條例|法例|規例|草案|議案|諮詢|施政|預算|稅務|稅項|收費|費用|規管|監管|機制|框架|指引|守則|辦法|方案|賣地|刊憲|修訂|檢討|統計|數據|人工智能|創新科技|中小企|就業|培訓|房屋|公屋|土地|福利|社會保障|退休保障|強積金|貿易|產業|管制|立法會'
    # 鲁港通 - 白名单仍会放进「出席/致辭/呼籲/火警」类条目（如 IMF 年會、泳灘紅旗），
    # 二次排除只留政策文本与政务数据，公告/仪式/执法/服务提示一律归档。
    title_exclude_patterns:
      - '致辭|致詞|演辭|發言|會見傳媒|記者會|出席|開幕|閉幕|典禮|酒會|午宴|晚宴|論壇|研討會|座談|考察|參觀|探訪|巡視|頒獎|嘉許|獲獎|表揚|比賽|錦標賽|運動會|音樂會|匯演|嘉年華|啟動禮|簽署儀式|呼籲|特別通知|火警|泳灘|紅旗|暴雨|颱風|風球|山泥傾瀉|水浸|停電|停水|交通意外|判囚|判刑|提堂|拘捕|被捕|檢控|任命|委任|出任|離任|請辭|逝世|訃告|哀悼|慰問|門診|疫苗|流感|衞生防護中心|感染|確診|招聘|招標|升降機|立法會七題|議案|對外商品貿易|契約修訂|地段增批|特權及豁免權'
    schedule: "30 */6 * * *"
    rate_limit_per_minute: 6
    max_pages_per_run: 60
    enabled: true

