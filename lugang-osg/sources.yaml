    schedule: "50 5 * * *"
    rate_limit_per_minute: 4
    max_pages_per_run: 60
    # 鲁港通 - 2026-11-27 试采停用：16 篇发现全部为图片海报（正文 177 字外壳 + img），
    # 无文本可提取、无 PDF/docx 直链，静态采集不可行
    enabled: false

