  - id: jinan_rc
    name: 海右人社政策通
    group: sd_business_talent
    organization: 海右人社政策通
    base_domains: [rc.jinan.gov.cn]
    allowed_path_prefixes: [/]
    discovery_method: api_json
    api_config:
      parse:
        id_field: id
        rows_path: rows
        body_fields:
        - - 政策级别
          - zcLevel
        - - 发布单位
          - sourceUnit
        - - 发布时间
          - publishTime
        - - 受理单位
          - acceptingUnit
        - - 有效期
          - validity
        - - 适用对象
          - applicableObjects
        - - 申请条件
          - applyCondition
        - - 申请材料
          - sqcl
        - - 政策支持
          - zczc
        - - 补贴标准
          - btbz
        - - 办理渠道
          - jbqd
        - - 政策文件
          - zcwj
        - - 政策依据
          - sourceFile
        - - 政策说明
          - policyExplanation
        - - 有效性说明
          - zcyxxsm
        - - 联系电话
          - phone
        title_field: zcmc
        url_template: https://rc.jinan.gov.cn/prod-api/portal/policyInfo/getInfo?id={id}
      endpoints:
      - https://rc.jinan.gov.cn/prod-api/portal/policyInfo/portalList?zcsylx=1&pageNum=1&pageSize=300
      - https://rc.jinan.gov.cn/prod-api/portal/policyInfo/portalList?zcsylx=2&pageNum=1&pageSize=300
      - https://rc.jinan.gov.cn/prod-api/portal/policyInfo/portalList?zcsylx=3&pageNum=1&pageSize=300
    schedule: "0 */8 * * *"
    rate_limit_per_minute: 6
    max_pages_per_run: 400
    enabled: true

