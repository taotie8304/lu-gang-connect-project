  - id: hk_investhk
    name: 投资推广署
    group: hk_economy_innovation
    organization: 香港投资推广署 InvestHK
    base_domains: [www.investhk.gov.hk]
    # 鲁港通 - P1-A：sitemap 实测 4803 条（全站新闻 246 条），首页 listing 是 JS 空壳。
    # since_days 截断一年前旧闻，url_pattern 只留 /zh-hk/news/ 单篇；标题白名单再挡掉
    # 门店开业/客户故事等商业新闻（用户要求：只要政策类信息）。
    allowed_path_prefixes: [/sitemap.xml, /zh-hk/news/]
    discovery_method: sitemap
    sitemap_urls:
      - "https://www.investhk.gov.hk/sitemap.xml"
    sitemap_since_days: 365
    sitemap_url_pattern: '/zh-hk/news/[^/]+/?$'
    title_include_patterns:
      - '政策|措施|計劃|資助|基金|津貼|補貼|援助|貸款|擔保|申請|條例|法例|規例|草案|議案|諮詢|施政|預算|稅務|稅項|收費|費用|規管|監管|機制|框架|指引|守則|辦法|方案|賣地|刊憲|修訂|檢討|統計|數據|人工智能|創新科技|中小企|就業|培訓|房屋|公屋|土地|福利|社會保障|退休保障|強積金|貿易|產業|管制|立法會'
    # 鲁港通 - 试采复核（2026-10-17）：5 条候选中 3 条为企业落户/扩张新闻，补充排除词
    title_exclude_patterns:
      - '開設|進駐|開業|旗艦店|門店|分店|晚宴|酒會|週年|周年|論壇|研討會|座談|考察|代表團|訪問|展覽|比賽|嘉年華|慶祝|總部|研發中心|辦事處|擴展|落戶|設立|融資|上市|高峰論壇|出海專班|招商成果|駐港公司'
    title_strip_suffixes: [" | InvestHK"]
    content_selector: .articlesdetail__container
    schedule: "30 8 * * *"
    rate_limit_per_minute: 6
    max_pages_per_run: 50
    enabled: true

  - id: hk_itf
    name: 创新及科技基金（ITF）计划页
    group: hk_economy_innovation
    organization: 创新科技署
    base_domains: [www.itf.gov.hk]
    # 鲁港通 - P1-A：13 个现行资助计划固定页，承载「全年接受申请/本轮截止/已停止」
    # 等状态文字，是防止 TVP 类过时答案的关键来源。栏目页为 /index.html 会被形态
    # 过滤，故用 fixed_url；pipeline 对 fixed_url 每次同步强制重抓以保鲜状态。
    allowed_path_prefixes: [/tc/funding-programmes/]
    discovery_method: fixed_url
    fixed_urls:
      - "https://www.itf.gov.hk/tc/funding-programmes/facilitating-technology/psts/index.html"
      - "https://www.itf.gov.hk/tc/funding-programmes/fostering-culture/gsp/index.html"
      - "https://www.itf.gov.hk/tc/funding-programmes/nurturing-talent/research-talent-hub/index.html"
      - "https://www.itf.gov.hk/tc/funding-programmes/promoting-new-industrialisation/itif/index.html"
      - "https://www.itf.gov.hk/tc/funding-programmes/promoting-new-industrialisation/new-industrialisation-support-scheme/index.html"
      - "https://www.itf.gov.hk/tc/funding-programmes/promoting-new-industrialisation/nias/index.html"
      - "https://www.itf.gov.hk/tc/funding-programmes/supporting-research/ess/index.html"
      - "https://www.itf.gov.hk/tc/funding-programmes/supporting-research/ftrss/index.html"
      - "https://www.itf.gov.hk/tc/funding-programmes/supporting-research/itsp/itsp-platform-seed/index.html"
      - "https://www.itf.gov.hk/tc/funding-programmes/supporting-research/mhktcfs/index.html"
      - "https://www.itf.gov.hk/tc/funding-programmes/supporting-start-ups/itvf/index.html"
      - "https://www.itf.gov.hk/tc/funding-programmes/supporting-start-ups/pitas/index.html"
      - "https://www.itf.gov.hk/tc/funding-programmes/supporting-start-ups/raiseplus/index.html"
    # 鲁港通 - 实测页面标题为「创科创投基金 - 创新及科技基金」，剥离统一后缀
    title_strip_suffixes: [" - 創新及科技基金"]
    content_selector: "#content"
    schedule: "30 6 * * *"
    rate_limit_per_minute: 6
    max_pages_per_run: 20
    enabled: true

  - id: hk_hkstp
