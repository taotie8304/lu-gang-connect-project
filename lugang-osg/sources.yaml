  # 鲁港通 - 香港生活办事：运输署驾照/车辆/跨境车辆（2026-11-20）
  # 栏目页与办事页均以 /index.html 结尾；只从栏目页取一层子页，导航页由正文门槛与
  # 链接密度守卫兜底，避免把牌照服务总览当成文档入库。
  - id: hk_td
    name: 香港运输署牌照与车辆服务
    group: hk_life_services
    organization: 香港运输署
    base_domains: [www.td.gov.hk]
    allowed_path_prefixes: [/tc/public_services/licences_and_permits/]
    discovery_method: listing
    listing_urls:
      - "https://www.td.gov.hk/tc/public_services/licences_and_permits/index.html"
      - "https://www.td.gov.hk/tc/public_services/licences_and_permits/driving_licences/index.html"
      - "https://www.td.gov.hk/tc/public_services/licences_and_permits/driving_licences/how_to_apply_for_a_driving_licence/index.html"
      - "https://www.td.gov.hk/tc/public_services/licences_and_permits/vehicle_licences/index.html"
      - "https://www.td.gov.hk/tc/public_services/licences_and_permits/vehicle_first_registration/index.html"
      - "https://www.td.gov.hk/tc/public_services/licences_and_permits/closed_road_permit_for_cross_boundary_vehicles/index.html"
    allow_index_pages: true
    # 鲁港通 - 只保留驾照、车辆登记/牌照、过境车辆与收费；驾驶教师、出租汽车等栏目排除
    link_pattern: '^https://www\.td\.gov\.hk/tc/public_services/licences_and_permits/(?:driving_licences/|edl/|vehicle_licences/|vehicle_first_registration/|closed_road_permit_for_cross_boundary_vehicles/|ad_hoc_quota_scheme_for_cross_boundary_pcs/|hzmb_macao_port_parknride/|southboundtravel/|fees_and_charges/|registration_marks_and_number_plates/)'
    title_strip_prefixes: ["運輸署 - "]
    title_exclude_patterns:
      - '駕駛教師|傷殘人士|投訴|聯絡我們|牌照事務處|表格|統計|公開資料|招聘|招標'
    schedule: "5 7 * * 0"
    rate_limit_per_minute: 4
    max_pages_per_run: 50
    enabled: true

  # 鲁港通 - 香港生活办事：积金局强积金指引（2026-11-20）
  # 站点默认语言即繁体中文；sitemap 只提供无语言前缀的地址（/tc/ 会 301 回落），
  # 故按绝对路径限域到强积金制度与 eMPF 两个栏目（约 52 页）。
  - id: hk_mpfa
    name: 香港积金局强积金指引
    group: hk_life_services
    organization: 香港强制性公积金计划管理局
    base_domains: [www.mpfa.org.hk]
    allowed_path_prefixes: [/sitemap.xml, /mpf-system/, /empf/]
    discovery_method: sitemap
    sitemap_urls:
      - "https://www.mpfa.org.hk/sitemap.xml"
    sitemap_url_pattern: '^https://www\.mpfa\.org\.hk/(?:mpf-system|empf)/'
    content_selector: "#mainContent"
    title_strip_suffixes: [" - 積金局"]
    schedule: "25 8 * * 0"
    rate_limit_per_minute: 4
    # sitemap 每轮从头处理，上限小于范围内链接数会让尾部页面永远轮不到
    max_pages_per_run: 60
    enabled: true

  # 鲁港通 - 香港海关旅客清关（2026-11-20）：大陆旅客过关高频——烟酒免税限额、
  # 现金申报、禁运物品。站点无 sitemap，栏目页为纯链接索引，故按实测固定 7 页采集；
  # 栏目页 /sc/passenger_clearance/index.html 本身不入库（导航枢纽）。
  - id: hk_customs_pc
    name: 香港海关旅客清关
    group: hk_life_services
    organization: 香港海关
    base_domains: [www.customs.gov.hk]
    allowed_path_prefixes:
      - /sc/service-enforcement-information/passenger-clearance/
      - /sc/service-enforcement-information/cargo-clearance/prohibited-articles/
    discovery_method: fixed_url
    fixed_urls:
      - "https://www.customs.gov.hk/sc/service-enforcement-information/passenger-clearance/red-green-channel-system/index.html"
      - "https://www.customs.gov.hk/sc/service-enforcement-information/passenger-clearance/duty-free-concessions/index.html"
      - "https://www.customs.gov.hk/sc/service-enforcement-information/passenger-clearance/prohibited-controlled-items/index.html"
      - "https://www.customs.gov.hk/sc/service-enforcement-information/passenger-clearance/currency-bearer-negotiable-instruments/index.html"
      - "https://www.customs.gov.hk/sc/service-enforcement-information/passenger-clearance/faqs/index.html"
      - "https://www.customs.gov.hk/sc/service-enforcement-information/passenger-clearance/faqs/common-charges-penalties/index.html"
      - "https://www.customs.gov.hk/sc/service-enforcement-information/cargo-clearance/prohibited-articles/index.html"
    # 鲁港通 - 2026-11-20 实测：正文 237–2,011 字，链接占比 0.06–0.30（未触守卫）
    title_overrides:
      "https://www.customs.gov.hk/sc/service-enforcement-information/passenger-clearance/red-green-channel-system/index.html": "香港海关 - 红绿通道系统（申报通道选择）"
      "https://www.customs.gov.hk/sc/service-enforcement-information/passenger-clearance/duty-free-concessions/index.html": "香港海关 - 免税优惠（烟酒入境限额）"
      "https://www.customs.gov.hk/sc/service-enforcement-information/passenger-clearance/prohibited-controlled-items/index.html": "香港海关 - 禁运及受管制物品（旅客须知）"
      "https://www.customs.gov.hk/sc/service-enforcement-information/passenger-clearance/currency-bearer-negotiable-instruments/index.html": "香港海关 - 现金类物品跨境申报（12 万港元）"
      "https://www.customs.gov.hk/sc/service-enforcement-information/passenger-clearance/faqs/index.html": "香港海关 - 旅客清关常见问题"
      "https://www.customs.gov.hk/sc/service-enforcement-information/passenger-clearance/faqs/common-charges-penalties/index.html": "香港海关 - 常见控罪及刑罚（旅客违规）"
      "https://www.customs.gov.hk/sc/service-enforcement-information/cargo-clearance/prohibited-articles/index.html": "香港海关 - 禁运物品（进出口管制细目）"
    schedule: "35 4 * * 0"
    rate_limit_per_minute: 4
    max_pages_per_run: 10
    enabled: true
