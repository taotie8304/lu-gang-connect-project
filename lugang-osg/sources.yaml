    group: hk_economy_innovation
    organization: 香港科技园公司
    base_domains: [www.hkstp.org]
    # 鲁港通 - P1-A：sitemap 实测 3288 条，新闻频道 834 条，多为孵化/合作/活动；
    # 政策白名单只保留资助计划、施政措施、规管等政策类内容（用户要求）。
    allowed_path_prefixes: [/zh-hk/sitemap.xml, /zh-hk/park-life/news-and-events/news/]
    discovery_method: sitemap
    sitemap_urls:
      - "https://www.hkstp.org/zh-hk/sitemap.xml"
    sitemap_since_days: 365
    sitemap_url_pattern: '/zh-hk/park-life/news-and-events/news/.+'
    # 鲁港通 - 试采复核（2026-10-17）：新闻频道 27 条候选中仅 4 条政策相关，其余为企业
    # 孵化/合作/活动/上市新闻；白名单收窄为政策文本与政府计划专用词，避免通用词放行。
    title_include_patterns:
      - '政策|措施|施政|預算案|規劃|綱要|資助計劃|支援計劃|實習計劃|監管沙盒|條例|法例|規例|草案|議案|諮詢|指引|守則|框架|機制|稅務|稅項|創科產業|土地|房屋|中小企|就業|培訓|立法會'
    # 鲁港通 - 新闻频道以园区活动/企业故事为主：排除典礼、招聘、峰会、上市融资等事件型报道
    title_exclude_patterns:
      - '開幕|開業|進駐|旗艦店|門店|分店|晚宴|酒會|週年|周年|論壇|研討會|座談|考察|代表團|展覽|比賽|嘉年華|慶祝|招聘日|同樂日|開放日|導賞|峰會|博覽|亮相|參展|落戶|上市|融資|策略合作|備忘錄|簽署|圓滿|成果展|成果日|啟動禮|體驗館|孵化計劃|加速計劃|出訪|開設|擴展'
    content_selector: .content
    schedule: "30 11 * * *"
    rate_limit_per_minute: 6
    max_pages_per_run: 100
    enabled: true

