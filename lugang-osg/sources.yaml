  - id: sd_commerce
    name: 山东省商务厅
    group: sd_business_talent
    organization: 山东省商务厅
    base_domains: [commerce.shandong.gov.cn]
    allowed_path_prefixes: [/]
    allow_http: true
    force_ipv4: true
    discovery_method: listing
    # 鲁港通 - 批4实测打通：信息公开 xxgk 检索接口（政策文件库 SD0202，按标题关键词
    # 检索、POST、{currpage} 逐页翻至空页）；旧配置指向 col106474 模板页（显示年报）
    # 才采不到政策文件。两关键词=两份检索清单（外资/外商），同一文档跨清单自动判重。
    method: POST
    listing_urls:
      - "http://commerce.shandong.gov.cn/module/xxgk/search.jsp?divid=div16288&jdid=79&area=&standardXxgk=0&infotypeId=SD0202&sortfield=top:0,compaltedate:0&currpage={currpage}&vc_title=%E5%A4%96%E8%B5%84"
      - "http://commerce.shandong.gov.cn/module/xxgk/search.jsp?divid=div16288&jdid=79&area=&standardXxgk=0&infotypeId=SD0202&sortfield=top:0,compaltedate:0&currpage={currpage}&vc_title=%E5%A4%96%E5%95%86"
    paginate:
      page_param: currpage
      start: 1
      max_pages: 10
    content_selector: "#zoom"
    schedule: "0 */8 * * *"
    rate_limit_per_minute: 4
    max_pages_per_run: 60
    enabled: true

