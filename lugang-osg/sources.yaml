  # 鲁港通 - 山东高校港澳台侨与国际学生招生（2026-11-27 用户指令）：大专院校只收港澳台/华侨生
  # 与海外留学生招生政策（含奖学金）；原 6 校全站新闻源已停用，改为各校留学生招生门户定向采集。
  - id: sd_sdu_istudy
    name: 山东大学国际学生招生（留学山大）
    group: academic
    organization: 山东大学
    base_domains: [www.istudy.sdu.edu.cn]
    # 鲁港通 - 2026-11-27 实测：zsjz.htm 列表 10 篇（2027 国际学生本硕博/预科/中文研修 +
    # 中国政府奖学金 A 类申请指引），正文容器 #vsb_content（博达模板），无 PDF 附件
    allowed_path_prefixes: [/info/, /jxj/, /lxxm/, /FAQ/, /xysh/, /zsjz.htm, /cyxz.htm]
    discovery_method: listing
    listing_urls:
      - "https://www.istudy.sdu.edu.cn/zsjz.htm"
      - "https://www.istudy.sdu.edu.cn/jxj/jxjgs.htm"
      - "https://www.istudy.sdu.edu.cn/lxxm/xlxm.htm"
    link_pattern: "https?://www\\.istudy\\.sdu\\.edu\\.cn/(info/\\d+/\\d+\\.htm|jxj/[a-z0-9_]+\\.htm|.*\\.pdf)"
    content_selector: "#vsb_content"
    title_include_patterns:
      - '招生|简章|申请|奖学|学费|收费|费用|专业|项目|课程|入学|指南|签证|住宿|保险|进修|预科|研修|本科|硕士|博士|留学|汉语|中文|商务|缴费'
    title_exclude_patterns:
