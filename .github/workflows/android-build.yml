# 鲁港通 - 安卓构建：只产出 APK 与更新清单，不触碰生产容器与镜像
name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - upgrade/fastgpt-4.16.2
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Detect signing material
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode keystore
        if: ${{ steps.signing.outputs.available == 'true' }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"

      # 鲁港通 - v3 仍强制安装已下线的 tools 包（Failed to find package 'tools'），改用 v4（上游 2026-09 修复）
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build signed release APK
        if: ${{ steps.signing.outputs.available == 'true' }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify APK signature
        if: ${{ steps.signing.outputs.available == 'true' }}
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
            app/build/outputs/apk/release/app-release.apk

      - name: Build debug APK (no signing secrets)
        if: ${{ steps.signing.outputs.available != 'true' }}
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare dist
        run: node scripts/ci-dist.mjs

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lugang-android
          path: android/dist/
          retention-days: 30
