# 鲁港通 - 安卓更新源（一次性 include，目录独立于 Next.js）
# 部署到 /www/server/panel/vhost/nginx-includes/lugang-android-updates.conf；不可放入 vhost/nginx/（该目录被 http 层 *.conf 通配加载，location 非法）
location ^~ /android/updates/ {
    alias /www/wwwroot/lugang-android-updates/;
    autoindex off;
    types {
        application/vnd.android.package-archive apk;
        application/json json;
    }
    add_header Cache-Control "public, max-age=300";
}

location = /android/updates/latest.json {
    alias /www/wwwroot/lugang-android-updates/latest.json;
    default_type application/json;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
}
